# Pre-commit gates for SambaAD ADWS.
#
# BLOCKING (every commit, on changed src/, classes/, and samba_adws/ files):
#   - §6.1 norms via tools/norms (1 class & 5 functions per file, functions
#     <=20 lines, nesting <=2, line <=100, '#' header block before each
#     def/class)
#   - ruff + flake8 style (naming, imports, line length, mutable defaults)
#   - mypy --strict (full typing; src/ and classes/ are fully typed)
#
# BLOCKING (every commit, also on changed tests/ and tools/test/ files):
#   - pytest level 0, i.e. everything that needs no directory. See
#     documentation/05-tests.md for the ladder and why this one is cheap
#     enough to block on.
#
# ADVISORY (manual stage):
#   - pylint
#   Run it with:  pre-commit run --hook-stage manual --all-files
#
# Setup:  pip3 install -r tools/installation/requirements-dev.txt && pre-commit install
minimum_pre_commit_version: "3.5.0"
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|classes|samba_adws)/(?!nettcp/|wcf/)

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-functions]
        files: ^(src|classes|samba_adws)/(?!nettcp/|wcf/)

  - repo: local
    hooks:
      - id: adws-norms
        name: ADWS coding norms (6.1, blocking)
        entry: python -m tools.norms --max-line 100 --require-headers
        language: python
        types: [python]
        files: ^(src|classes|samba_adws)/(?!nettcp/|wcf/)
        pass_filenames: true

      - id: mypy
        name: mypy --strict (typing, blocking)
        entry: python -m mypy src classes samba_adws
        language: system
        types: [python]
        files: ^(src|classes|samba_adws)/(?!nettcp/|wcf/)
        pass_filenames: false

      # -m "not dc" is what keeps this hook honest on the DC itself: there
      # python3-samba imports, tests/conftest.py stops skipping the `dc`
      # cases, and an unscoped run would provision-test the live directory
      # on every commit. Deselecting the marker gives the same level-0 set
      # on a workstation and on a DC. --ignore=tests/dc says the same thing
      # by path, so the guarantee survives a future tests/dc file that
      # forgets `pytestmark = pytest.mark.dc`. pass_filenames is false
      # because the suite is selected by pyproject's testpaths, not by what
      # changed. `python3`, not `python`: Debian has no /usr/bin/python
      # unless python-is-python3 is installed, and language: system runs the
      # entry as written.
      - id: pytest
        name: pytest level 0 (no directory needed, blocking)
        entry: python3 -m pytest -q -m "not dc" --ignore=tests/dc
        language: system
        types: [python]
        files: ^(src|classes|samba_adws|tests|tools/test)/
        pass_filenames: false

      - id: pylint
        name: pylint (advisory)
        entry: pylint
        language: system
        types: [python]
        files: ^(src|classes|samba_adws)/(?!nettcp/|wcf/)
        stages: [manual]
