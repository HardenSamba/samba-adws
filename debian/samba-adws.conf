# Configuration of the Active Directory Web Services endpoint.
# Read by samba-adws.service and by "samba-adws run". The names are the
# service's own environment variables. Changes take effect on:
#     systemctl restart samba-adws

# Address the endpoint answers on. 0.0.0.0 is what Windows tooling on the
# network needs; narrow it to the management interface if you have one.
ADWS_HOST=0.0.0.0

# 9389/tcp is fixed by the protocol. Changing it means no Windows client will
# find the service.
ADWS_PORT=9389

# An absolute path matters here. The service's own default is relative, and a
# service with a read-only /usr would try to write into its payload directory.
# The directory is created by systemd (LogsDirectory=) with mode 0750.
ADWS_LOG_FILE=/var/log/samba-adws/adws.log
ADWS_LOG_LEVEL=INFO

# Ceiling on any length a client announces, in bytes. 1 MB matches the
# MaxReceivedMessageSize default of the Windows ADWS service. A connection
# announcing more is closed.
ADWS_MAX_MESSAGE_SIZE=1048576
