# Tooling configuration for SambaAD ADWS.
# Packaging is tracked separately by issue #6; this file does not define a build.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "classes", "samba_adws"]
# tools/ holds dev tooling + vendored work/windows; src/nettcp + src/wcf are
# vendored third-party protocol libs (not subject to project norms).
extend-exclude = ["tools", "src/nettcp", "src/wcf"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (no import *), I import sorting,
# N naming (§6.1), B bugbear (mutable defaults, bare except), C4, UP.
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]
# Keep the codebase's typing-module style (Dict/List/Optional) instead of
# forcing PEP 585/604 builtins — consistent with the existing code.
# N818: the exception hierarchy deliberately uses the `Exception` suffix.
# UP045 belongs on that list and is not on it: it does not exist in the ruff
# this repository pins (0.8.6), and naming a rule ruff does not know is a TOML
# parse error, not a warning. The hook therefore aborted before linting
# anything, on every commit since the entry was added. samba-adws#29 bumps the
# pin and puts it back with the 48 findings a current ruff reports.
ignore = ["UP006", "UP007", "UP035", "N818"]

[tool.mypy]
# Full typing is the norm: strict, checked against the Linux runtime
# (ForkingMixIn etc. only exist where os.fork does).
python_version = "3.11"
platform = "linux"
strict = true
ignore_missing_imports = true
files = ["src", "classes", "samba_adws"]
# src/nettcp + src/wcf are vendored protocol libraries (untyped) — not checked.
exclude = '^src/(nettcp|wcf)/'

# Treat the vendored libs as an Any boundary so calls into them pass under strict.
[[tool.mypy.overrides]]
module = ["src.nettcp.*", "src.wcf.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
# tests/unit runs anywhere; tests/dc needs a provisioned directory and is
# skipped without python3-samba (tests/conftest.py). tools/test still holds
# the operator diagnostic and the suites written before this layout existed.
testpaths = ["tests", "tools/test"]
markers = [
    "dc: needs a provisioned Samba AD DC; skipped when python3-samba is absent",
]
